[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/)
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No installers generated by dist: tokred ships its own scripts in `install/` (rustup style).
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
# Archive formats (the install scripts and `tokred update` download these and verify the `.sha256` sidecar)
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
# Run only the plan step on pull requests
pr-run-mode = "plan"
# Dependabot bumps the action versions inside the generated release.yml; accept that instead of
# failing the plan step ("out of date contents"). `dist generate` still works when asked.
allow-dirty = ["ci"]

# The install scripts are release assets too, next to the archives (so
# `releases/latest/download/install.sh` works). They are copied from `install/` as they are.
[[dist.extra-artifacts]]
artifacts = ["install.sh", "uninstall.sh", "install.ps1", "uninstall.ps1"]
build = ["sh", "-c", "cp install/install.sh install/uninstall.sh install/install.ps1 install/uninstall.ps1 ."]
