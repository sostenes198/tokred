[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sostenes198/tokred"
authors = ["Sóstenes Souza"]

[workspace.dependencies]
# Internal crates
tokred-core = { path = "crates/tokred-core", version = "0.1.0" }
tokred-install = { path = "crates/tokred-install", version = "0.1.0" }
tokred-hooks = { path = "crates/tokred-hooks", version = "0.1.0" }
tokred-metrics = { path = "crates/tokred-metrics", version = "0.1.0" }
tokred-pricing = { path = "crates/tokred-pricing", version = "0.1.0" }
tokred-audit = { path = "crates/tokred-audit", version = "0.1.0" }
tokred-update = { path = "crates/tokred-update", version = "0.1.0" }
tokred-report = { path = "crates/tokred-report", version = "0.1.0" }
tokred-store = { path = "crates/tokred-store", version = "0.1.0" }

# External crates
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
which = "8.0.6"

# Test-only crates
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
