[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sostenes198/tokred"
homepage = "https://github.com/sostenes198/tokred"
authors = ["Sóstenes Souza"]

[workspace.dependencies]
# Internal crates
tokred-core = { path = "crates/tokred-core", version = "1.1.0" }
tokred-install = { path = "crates/tokred-install", version = "1.1.0" }
tokred-hooks = { path = "crates/tokred-hooks", version = "1.1.0" }
tokred-metrics = { path = "crates/tokred-metrics", version = "1.1.0" }
tokred-pricing = { path = "crates/tokred-pricing", version = "1.1.0" }
tokred-audit = { path = "crates/tokred-audit", version = "1.1.0" }
tokred-update = { path = "crates/tokred-update", version = "1.1.0" }
tokred-report = { path = "crates/tokred-report", version = "1.1.0" }
tokred-store = { path = "crates/tokred-store", version = "1.1.0" }
tokred-proxy = { path = "crates/tokred-proxy", version = "1.1.0" }
tokred-routing = { path = "crates/tokred-routing", version = "1.1.0" }
tokred-suggest = { path = "crates/tokred-suggest", version = "1.1.0" }
tokred-compress = { path = "crates/tokred-compress", version = "1.1.0" }

# External crates
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
which = "8.0.6"
# Proxy (tokred-proxy only). TLS uses rustls with the `ring` provider, like ureq: aws-lc-rs needs
# cmake/NASM and breaks the musl and Windows release builds.
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "client-proxy", "http1", "server"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.11"
flate2 = "1.1.10"
globset = "0.4.21"
opener = "0.9.0"
semver = "1.0.28"
sha2 = "0.11.1"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# Test-only crates
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"
# A throwaway CA and TLS server for the corporate-network tests of tokred-proxy.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
