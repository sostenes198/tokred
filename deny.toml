[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Spec section 15: MIT, Apache-2.0, BSD, ISC, Unicode, Zlib.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

# `option-ext` (MPL-2.0) is a transitive dependency of `directories`. MPL-2.0 is file-level
# copyleft and we use it unmodified, so a per-crate exception is enough. See docs/decisions.md.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
