# Publishes a release to the package managers that `dist` does not cover itself.
# Called by the generated release.yml (see `publish-jobs` in dist-workspace.toml).
#
# Secrets to configure in the repository (none of this runs until a release tag is pushed):
#   HOMEBREW_TAP_TOKEN   push access to sostenes198/homebrew-tap (also used by dist itself)
#   SCOOP_BUCKET_TOKEN   push access to sostenes198/scoop-bucket
#   WINGET_TOKEN         classic PAT with public_repo, used to open the winget-pkgs pull request
#   CARGO_REGISTRY_TOKEN crates.io API token
name: Publish to package managers

on:
  workflow_call:
    inputs:
      plan:
        description: The dist release plan (JSON)
        required: true
        type: string

jobs:
  scoop:
    name: Scoop bucket
    runs-on: ubuntu-latest
    steps:
      - name: Update the manifest in the bucket
        env:
          PLAN: ${{ inputs.plan }}
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(echo "$PLAN" | jq -r .announcement_tag)
          version=${tag#v}
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          sha() { curl -fsSL "${base}/tokred-$1.zip.sha256" | cut -d' ' -f1; }
          x64=$(sha x86_64-pc-windows-msvc)
          arm=$(sha aarch64-pc-windows-msvc)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/sostenes198/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          jq -n --arg v "$version" --arg base "$base" --arg x64 "$x64" --arg arm "$arm" '{
            version: $v,
            description: "Token and cost reducer for Claude Code: model routing, context guards and local metrics",
            homepage: "https://github.com/sostenes198/tokred",
            license: "MIT OR Apache-2.0",
            architecture: {
              "64bit": { url: "\($base)/tokred-x86_64-pc-windows-msvc.zip", hash: $x64, extract_dir: "tokred-x86_64-pc-windows-msvc" },
              arm64:   { url: "\($base)/tokred-aarch64-pc-windows-msvc.zip", hash: $arm, extract_dir: "tokred-aarch64-pc-windows-msvc" }
            },
            bin: "tokred.exe",
            notes: "Run \"tokred configure\" to set up the Claude Code integration.",
            checkver: "github",
            autoupdate: {
              architecture: {
                "64bit": { url: "https://github.com/sostenes198/tokred/releases/download/v$version/tokred-x86_64-pc-windows-msvc.zip", extract_dir: "tokred-x86_64-pc-windows-msvc" },
                arm64:   { url: "https://github.com/sostenes198/tokred/releases/download/v$version/tokred-aarch64-pc-windows-msvc.zip", extract_dir: "tokred-aarch64-pc-windows-msvc" }
              }
            }
          }' > bucket/bucket/tokred.json
          cd bucket
          git config user.name "tokred release bot"
          git config user.email "noreply@users.noreply.github.com"
          git add bucket/tokred.json
          git diff --cached --quiet || git commit -m "tokred ${version}"
          git push

  winget:
    name: winget
    runs-on: windows-latest
    steps:
      # Needs the package to exist in winget-pkgs once (first manifest submitted by hand);
      # after that this action opens an update pull request for every release.
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: sostenes198.tokred
          installers-regex: '-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  homebrew-caveats:
    name: Homebrew caveats
    runs-on: ubuntu-latest
    steps:
      # dist publishes the formula in a sibling job but has no option for caveats, so wait for
      # the formula of this version to land in the tap and then add the caveat to it.
      - name: Add the caveat to the formula
        env:
          PLAN: ${{ inputs.plan }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(echo "$PLAN" | jq -r .announcement_tag)
          version=${tag#v}
          for attempt in $(seq 1 30); do
            rm -rf tap
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/sostenes198/homebrew-tap.git" tap
            if grep -q "version \"${version}\"" tap/Formula/tokred.rb 2>/dev/null; then break; fi
            echo "formula for ${version} not in the tap yet (attempt ${attempt}); waiting"
            sleep 20
          done
          grep -q "version \"${version}\"" tap/Formula/tokred.rb
          if ! grep -q "def caveats" tap/Formula/tokred.rb; then
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("tap/Formula/tokred.rb")
          s = p.read_text()
          caveat = '  def caveats\n    <<~EOS\n      Run "tokred configure" to set up the Claude Code integration.\n    EOS\n  end\n\n'
          s = re.sub(r"(\n  def install\n)", "\n" + caveat.rstrip("\n") + "\n\\1", s, count=1)
          p.write_text(s)
          PY
          fi
          cd tap
          git config user.name "tokred release bot"
          git config user.email "noreply@users.noreply.github.com"
          git add Formula/tokred.rb
          git diff --cached --quiet || git commit -m "tokred ${version}: add caveats"
          git push

  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
