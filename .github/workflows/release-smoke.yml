name: Release smoke
run-name: Release smoke ${{ inputs.tag || github.event.workflow_run.head_branch }}

# Installs tokred from the PUBLISHED GitHub release of a tag (its own install.sh / install.ps1) and
# checks every feature against real state (see docs/release.md, "Release smoke test"). A release is
# not announced until this workflow is green for its tag.
#
# The scripts under tests/release come from the branch this workflow runs on (the default branch for
# a `workflow_run`), the assets come from the tag: a tag built before the smoke test existed can be
# tested too.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (for example v0.1.0-rc.1)
        required: true
        type: string
      repo:
        description: Repository that owns the release (default - this repository)
        required: false
        type: string

permissions:
  contents: read

env:
  # The tag comes through the environment, never interpolated into a script.
  SMOKE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
  SMOKE_REPO: ${{ inputs.repo || github.repository }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  native:
    name: native (${{ matrix.os }})
    # Only a successful Release run for a tag (`v*`), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is the Intel runner (macos-13 was retired by GitHub).
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    env:
      SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
    steps:
      - uses: actions/checkout@v7
      # The test runs a small fake API in Python: use the runner's own, not whatever the image has.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test (macOS and Linux)
        if: runner.os != 'Windows'
        run: sh tests/release/smoke.sh "$SMOKE_TAG"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Edits the runner's user PATH and PowerShell profile (and restores them); Actions sets CI=true.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\release\smoke.ps1 -Tag $env:SMOKE_TAG -Repo $env:SMOKE_REPO
      - name: Upload the logs of the failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.os }}
          path: smoke-logs
          if-no-files-found: ignore

  containers:
    name: linux (${{ matrix.image }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Alpine has no glibc: it proves the static musl binary.
        image: ['alpine:3.20', 'debian:12-slim', 'fedora:40']
    defaults:
      run:
        shell: sh
    env:
      SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
    steps:
      - name: Install what the image lacks (curl, python3, sqlite, ps, git for checkout)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl python3 sqlite tar git
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl python3 sqlite3 procps tar gzip git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y curl python3 sqlite procps-ng tar gzip diffutils findutils git
          else
            echo "unsupported image" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Smoke test
        run: sh tests/release/smoke.sh "$SMOKE_TAG"
      - name: Upload the logs of the failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ strategy.job-index }}-${{ matrix.image == 'alpine:3.20' && 'alpine' || matrix.image == 'debian:12-slim' && 'debian' || 'fedora' }}
          path: smoke-logs
          if-no-files-found: ignore

  # A release candidate only exists until its final version is out: once the smoke test of a stable
  # release has passed everywhere, the pre-releases (and tags) of that same version are deleted.
  cleanup-candidates:
    name: delete the release candidates
    needs: [native, containers]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete the pre-releases of this version
        run: |
          # Only a stable tag (vX.Y.Z); anything else, including another version's candidates, stays.
          if ! printf '%s\n' "$SMOKE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$SMOKE_TAG is not a stable release: nothing to delete"
            exit 0
          fi
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"$SMOKE_TAG-rc.\"))) | .tagName")
          for tag in $tags; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
