[package]
name = "tokred-proxy"
description = "Local proxy between Claude Code and the Anthropic API: streaming pass-through, measurement and the hook pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokred-core = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `channel` gives the fake upstream of the tests a body it can stream and abort.
http-body-util = { workspace = true, features = ["channel"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
